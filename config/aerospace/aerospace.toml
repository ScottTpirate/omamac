# Omamac - AeroSpace profile
# Pair this with the bundled Karabiner profile, which swaps Left Command/Option.
# That makes physical Command behave like Omarchy's "Super" key.

after-startup-command = []
start-at-login = true

enable-normalization-flatten-containers = false
enable-normalization-opposite-orientation-for-nested-containers = false

on-focused-monitor-changed = ['move-mouse monitor-lazy-center']
on-focus-changed = ['move-mouse window-lazy-center']

[mode.main.binding]
# Launchers / apps (Omarchy-ish)
alt-space = 'exec-and-forget open -na "Raycast"'
alt-cmd-space = 'exec-and-forget open -na "Raycast"'
alt-enter = 'exec-and-forget open -na "Alacritty"'
alt-shift-b = 'exec-and-forget open -na "Google Chrome"'
alt-shift-cmd-b = 'exec-and-forget open -na "Google Chrome" --args --incognito'
alt-shift-f = 'exec-and-forget open -na "Finder"'
alt-shift-n = 'exec-and-forget open -na "Alacritty" --args -e nvim'
alt-shift-d = 'exec-and-forget open -na "Alacritty" --args -e lazydocker'
alt-shift-c = 'exec-and-forget open -na "Google Chrome" --args --app=https://app.hey.com/calendar'
alt-shift-e = 'exec-and-forget open -na "Google Chrome" --args --app=https://app.hey.com'
alt-shift-a = 'exec-and-forget open -na "ChatGPT"'
alt-shift-o = 'exec-and-forget open -na "Obsidian"'
alt-shift-m = 'exec-and-forget open -na "Spotify"'
alt-shift-slash = 'exec-and-forget open -na "1Password"'
alt-shift-g = 'exec-and-forget open -na "Signal"'
alt-shift-cmd-g = 'exec-and-forget open -na "WhatsApp"'
alt-shift-ctrl-g = 'exec-and-forget open -na "Google Chrome" --args --app=https://messages.google.com/web'
alt-shift-x = 'exec-and-forget open -na "Google Chrome" --args --app=https://x.com'
alt-shift-cmd-x = 'exec-and-forget open -na "Google Chrome" --args --app=https://x.com/compose/post'
alt-shift-y = 'exec-and-forget open -na "Google Chrome" --args --app=https://youtube.com'

# Workspace navigation
alt-tab = 'workspace --wrap-around next'
alt-shift-tab = 'workspace --wrap-around prev'
alt-ctrl-tab = 'workspace-back-and-forth'
alt-comma = 'workspace --wrap-around prev'
alt-period = 'workspace --wrap-around next'

# Window focus (arrows + vim keys)
alt-left = 'focus --boundaries-action wrap-around-the-workspace left'
alt-down = 'focus --boundaries-action wrap-around-the-workspace down'
alt-up = 'focus --boundaries-action wrap-around-the-workspace up'
alt-right = 'focus --boundaries-action wrap-around-the-workspace right'
alt-h = 'focus --boundaries-action wrap-around-the-workspace left'
alt-j = 'focus --boundaries-action wrap-around-the-workspace down'
alt-l = 'focus --boundaries-action wrap-around-the-workspace right'

# Swap windows
alt-shift-left = 'swap left'
alt-shift-down = 'swap down'
alt-shift-up = 'swap up'
alt-shift-right = 'swap right'
alt-shift-h = 'swap left'
alt-shift-j = 'swap down'
alt-shift-l = 'swap right'

# Move window
alt-ctrl-left = 'move left'
alt-ctrl-down = 'move down'
alt-ctrl-up = 'move up'
alt-ctrl-right = 'move right'

# Window modes and layout
alt-w = 'close --quit-if-last-window'
alt-t = 'layout floating tiling'
alt-o = 'macos-native-minimize'
alt-f = 'fullscreen'
f11 = 'fullscreen'
alt-backslash = 'layout tiles horizontal vertical'
alt-cmd-backslash = 'layout h_accordion'
alt-g = 'layout v_accordion'
alt-b = 'balance-sizes'
alt-cmd-b = 'flatten-workspace-tree'

# Scratchpad-like workspace
alt-s = 'workspace scratchpad'
alt-cmd-s = 'move-node-to-workspace scratchpad'

# Resizing (maps well to Omarchy +/- patterns)
alt-equal = 'resize width +50'
alt-minus = 'resize width -50'
alt-shift-equal = 'resize height +50'
alt-shift-minus = 'resize height -50'

# Workspaces 1..10
alt-1 = 'workspace 1'
alt-2 = 'workspace 2'
alt-3 = 'workspace 3'
alt-4 = 'workspace 4'
alt-5 = 'workspace 5'
alt-6 = 'workspace 6'
alt-7 = 'workspace 7'
alt-8 = 'workspace 8'
alt-9 = 'workspace 9'
alt-0 = 'workspace 10'

# Move focused window to workspace N (stay)
alt-shift-1 = 'move-node-to-workspace 1'
alt-shift-2 = 'move-node-to-workspace 2'
alt-shift-3 = 'move-node-to-workspace 3'
alt-shift-4 = 'move-node-to-workspace 4'
alt-shift-5 = 'move-node-to-workspace 5'
alt-shift-6 = 'move-node-to-workspace 6'
alt-shift-7 = 'move-node-to-workspace 7'
alt-shift-8 = 'move-node-to-workspace 8'
alt-shift-9 = 'move-node-to-workspace 9'
alt-shift-0 = 'move-node-to-workspace 10'

# Move focused window to workspace N and follow
alt-ctrl-1 = 'move-node-to-workspace --focus-follows-window 1'
alt-ctrl-2 = 'move-node-to-workspace --focus-follows-window 2'
alt-ctrl-3 = 'move-node-to-workspace --focus-follows-window 3'
alt-ctrl-4 = 'move-node-to-workspace --focus-follows-window 4'
alt-ctrl-5 = 'move-node-to-workspace --focus-follows-window 5'
alt-ctrl-6 = 'move-node-to-workspace --focus-follows-window 6'
alt-ctrl-7 = 'move-node-to-workspace --focus-follows-window 7'
alt-ctrl-8 = 'move-node-to-workspace --focus-follows-window 8'
alt-ctrl-9 = 'move-node-to-workspace --focus-follows-window 9'
alt-ctrl-0 = 'move-node-to-workspace --focus-follows-window 10'

# Summon workspace N to current monitor
alt-ctrl-shift-1 = 'summon-workspace 1'
alt-ctrl-shift-2 = 'summon-workspace 2'
alt-ctrl-shift-3 = 'summon-workspace 3'
alt-ctrl-shift-4 = 'summon-workspace 4'
alt-ctrl-shift-5 = 'summon-workspace 5'
alt-ctrl-shift-6 = 'summon-workspace 6'
alt-ctrl-shift-7 = 'summon-workspace 7'
alt-ctrl-shift-8 = 'summon-workspace 8'
alt-ctrl-shift-9 = 'summon-workspace 9'
alt-ctrl-shift-0 = 'summon-workspace 10'

# Multi-monitor
alt-ctrl-h = 'focus-monitor left'
alt-ctrl-l = 'focus-monitor right'
alt-ctrl-comma = 'move-workspace-to-monitor prev --wrap-around'
alt-ctrl-period = 'move-workspace-to-monitor next --wrap-around'
alt-shift-cmd-left = 'move-workspace-to-monitor left'
alt-shift-cmd-right = 'move-workspace-to-monitor right'
alt-ctrl-shift-h = 'move-node-to-monitor left --focus-follows-window'
alt-ctrl-shift-l = 'move-node-to-monitor right --focus-follows-window'

# System controls (best-effort macOS equivalents)
alt-esc = 'exec-and-forget /System/Library/CoreServices/Menu\ Extras/User.menu/Contents/Resources/CGSession -suspend'
alt-cmd-l = 'exec-and-forget /System/Library/CoreServices/Menu\ Extras/User.menu/Contents/Resources/CGSession -suspend'
alt-ctrl-a = 'exec-and-forget open -na "Audio MIDI Setup"'
alt-ctrl-b = 'exec-and-forget open "x-apple.systempreferences:com.apple.BluetoothSettings"'
alt-ctrl-w = 'exec-and-forget open "x-apple.systempreferences:com.apple.wifi-settings-extension"'
alt-ctrl-s = 'exec-and-forget open -na "LocalSend"'
alt-ctrl-t = 'exec-and-forget open -na "Activity Monitor"'

# Capture (best-effort macOS equivalents)
alt-cmd-shift-4 = 'exec-and-forget screencapture -i -c'
alt-cmd-shift-5 = 'exec-and-forget open -na "Screenshot"'
alt-cmd-shift-6 = 'exec-and-forget open -na "QuickTime Player"'
alt-cmd-shift-7 = 'exec-and-forget open -na "Digital Color Meter"'

# Clipboard manager
alt-ctrl-v = 'exec-and-forget open "raycast://extensions/raycast/clipboard-history/clipboard-history"'

# Hotkeys reference
alt-k = 'exec-and-forget qlmanage -p "$HOME/.config/omamac/hotkeys.md" >/dev/null 2>&1'

# Reload / modes
alt-shift-r = 'reload-config'
alt-r = 'mode resize'

[mode.resize.binding]
h = 'resize width -50'
j = 'resize height +50'
k = 'resize height -50'
l = 'resize width +50'
left = 'resize width -50'
down = 'resize height +50'
up = 'resize height -50'
right = 'resize width +50'
enter = 'mode main'
esc = 'mode main'
